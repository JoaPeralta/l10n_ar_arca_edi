name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Every job here is offline and disposable, so a run superseded by the next push
# is simply cancelled.
#
# This used to be more complicated: the group carried the event name and
# cancelling was conditional, because a manual run could already be holding an
# ARCA access ticket that cancelling would destroy. No job in this workflow can
# reach ARCA any more -- that lives in arca-homologation.yml, which runs against
# a database that keeps its ticket -- so the complication went with it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned rather than floating: a build must be able to say exactly which
  # Odoo it ran against.
  ODOO_IMAGE: odoo:19.0-20260723

jobs:
  lint:
    name: Lint and manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling
        run: pip install --quiet ruff==0.6.9 PyYAML==6.0.2

      # Correctness only. Enforcing a formatter upstream does not use would
      # bury real changes under a reformat of the whole module.
      - name: Ruff
        run: ruff check .

      # Structural tests over the workflows and the operational tools: that no
      # job here can reach ARCA, that the homologación runner stays read-only,
      # and that the bootstrap never destroys what costs a ticket. All offline:
      # no token, no network, no ARCA.
      - name: Workflow and tooling tests
        run: |
          python -m unittest discover \
            --start-directory .github/scripts \
            --top-level-directory .github/scripts \
            --pattern 'test_*.py' \
            --verbose

      - name: Manifest is valid Python and declares what it needs
        run: |
          python - <<'PY'
          import ast
          import pathlib

          manifest = ast.literal_eval(pathlib.Path("__manifest__.py").read_text())

          assert manifest["license"] == "AGPL-3", manifest["license"]
          assert manifest["version"].startswith("19.0."), manifest["version"]
          assert "l10n_ar" in manifest["depends"], manifest["depends"]

          missing = [
              entry for entry in manifest["data"]
              if not pathlib.Path(entry).exists()
          ]
          assert not missing, f"declared but absent: {missing}"

          for asset in manifest.get("assets", {}).get("web.assets_backend", []):
              path = pathlib.Path(asset.split("/", 1)[1])
              assert path.exists(), f"missing asset: {asset}"

          print("manifest OK")
          PY

      - name: XML is well formed
        run: |
          python - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET

          for path in sorted(pathlib.Path(".").rglob("*.xml")):
              if ".github" in path.parts:
                  continue
              ET.parse(path)
          print("XML OK")
          PY

  secrets:
    name: No secrets committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject private keys and certificates in the tree
        run: |
          set -euo pipefail
          # Test fixtures generate their key material at runtime, so anything
          # that looks like real key material has no business being committed.
          if git grep -nI -E -- '-----BEGIN (RSA |EC |OPENSSH |PGP )?PRIVATE KEY-----' -- . ':!.github/workflows/ci.yml'; then
            echo "::error::A private key is committed to the repository"
            exit 1
          fi
          if git ls-files | grep -E '\.(pem|key|p12|pfx|crt|cer)$'; then
            echo "::error::Certificate or key files are committed to the repository"
            exit 1
          fi
          echo "No key material found"

      - name: Reject hard-coded ARCA credentials
        run: |
          set -euo pipefail
          # A literal value assigned to one of these variables. Shell
          # substitutions are how the documentation shows the variables being
          # set from a file, so a value starting with $ is not a credential.
          if git grep -nI -E 'ARCA_HOMO_(CERT|PRIVATE_KEY|CERT_HOLDER_CUIT|REPRESENTED_CUIT)[[:space:]]*=[[:space:]]*["'\''][^$"'\'']{16,}' \
              -- . ':!.github/workflows/ci.yml'; then
            echo "::error::Homologation credentials appear to be hard-coded"
            exit 1
          fi
          echo "No hard-coded credentials found"

      - name: Production endpoints are never the default
        run: |
          set -euo pipefail
          # A default that points at production is the one mistake that cannot
          # be undone, so it is checked mechanically.
          if grep -rn 'default="production"\|default='\''production'\''' --include=*.py --include=*.xml .; then
            echo "::error::Something defaults to the ARCA production environment"
            exit 1
          fi
          echo "Production is not a default anywhere"

  test:
    name: Odoo 19 tests
    runs-on: ubuntu-latest
    container:
      image: odoo:19.0-20260723
      options: --user root
    defaults:
      run:
        shell: bash
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          path: extra-addons/l10n_ar_arca_edi

      - name: Report the environment under test
        run: |
          odoo --version
          python3 -c "import zeep, cryptography, lxml; print('zeep', zeep.__version__); print('cryptography', cryptography.__version__); print('lxml', lxml.__version__ if hasattr(lxml, '__version__') else 'n/a')"

      - name: Install and run the test suite
        env:
          PGHOST: db
          PGUSER: odoo
          PGPASSWORD: odoo
        run: |
          set -o pipefail
          odoo \
            --db_host=db --db_user=odoo --db_password=odoo \
            -d ci_l10n_ar_arca_edi \
            --addons-path=/usr/lib/python3/dist-packages/odoo/addons,${GITHUB_WORKSPACE}/extra-addons \
            -i l10n_ar_arca_edi \
            --test-enable \
            --test-tags '/l10n_ar_arca_edi' \
            --without-demo=all \
            --log-level=info \
            --max-cron-threads=0 \
            --stop-after-init 2>&1 | tee odoo-test.log

      - name: Check the test summary
        run: |
          # Odoo's exit status already covers failures; this reads its own
          # summary so a suite that silently did not run is caught too. Grepping
          # for ERROR lines is not usable here: one test deliberately violates a
          # unique index to prove the database enforces the invariant, and
          # PostgreSQL logs that at ERROR level.
          summary=$(grep -oE '[0-9]+ failed, [0-9]+ error\(s\) of [0-9]+ tests' odoo-test.log | tail -1)
          if [ -z "$summary" ]; then
            echo "::error::No test summary was produced; the suite did not run."
            exit 1
          fi
          echo "$summary"
          failed=${summary%% failed*}
          rest=${summary#* failed, }
          errors=${rest%% error*}
          total=${summary##* of }
          total=${total%% tests}
          if [ "$failed" != "0" ] || [ "$errors" != "0" ]; then
            echo "::error::$summary"
            exit 1
          fi
          if [ "$total" -lt 100 ]; then
            echo "::error::Only $total tests ran; the suite looks truncated."
            exit 1
          fi
          echo "$total tests passed"

      # The guarantees the suite above cannot make. Under `current_test` nothing
      # is committed: fiscal_transaction takes its single-cursor branch and
      # checkpoint() degrades to flush(), so an ORM test proving "the value is
      # still there" proves only that it is there in the transaction that wrote
      # it. That was always true of the access ticket, and it is now equally
      # true of the private key, which lives in a column of its own.
      #
      # This spawns real `odoo shell` processes against a database of its own.
      # For the ticket: one process obtains it and exits, the next must find it
      # in PostgreSQL. For the key: one process generates it and exits, the next
      # must load it out of the column, sign with it, and be refused a second
      # generation without a byte of the first one moving.
      #
      # Still offline -- _authenticate is replaced and zeep.Client is made
      # unbuildable in every child, and no key material is ever printed.
      - name: Ticket and private key survive their process
        working-directory: extra-addons/l10n_ar_arca_edi
        env:
          PGHOST: db
          PGPORT: "5432"
          PGUSER: odoo
          PGPASSWORD: odoo
        run: |
          set -o pipefail
          # Exported here rather than declared in `env:` because this job runs in
          # a container: `github.workspace` is the path on the *host*, while
          # GITHUB_WORKSPACE inside the container is where the checkout actually
          # is. Only the shell variable is right on this side of the mount.
          export ARCA_TEST_ADDONS_PATH="/usr/lib/python3/dist-packages/odoo/addons,${GITHUB_WORKSPACE}/extra-addons"
          python3 -m unittest discover \
            --start-directory integration \
            --top-level-directory integration \
            --pattern 'test_*.py' \
            --verbose 2>&1 | tee cross-process.log

      # A skip here would mean a proof silently did not run. Both are checked:
      # `skipIf` on a missing `odoo` or PostgreSQL is exactly how they would
      # disappear without failing anything.
      - name: The cross-process proofs actually ran
        run: |
          set -euo pipefail
          log=extra-addons/l10n_ar_arca_edi/cross-process.log
          if grep -q "skipped" "$log"; then
            echo "::error::A cross-process proof was skipped."
            grep -i "skip" "$log" || true
            exit 1
          fi
          # Named individually: discovery finding only some of the files would
          # leave the run green with part of the evidence.
          for proof in TestTicketSurvivesTheProcess \
                       TestPrivateKeySurvivesTheProcess \
                       TestUpgradeWithNothingToLose \
                       TestUpgradeWithMaterialInAttachments \
                       TestUpgradePreservesCronDecisions; do
            if ! grep -q "${proof}" "$log"; then
              echo "::error::${proof} did not run."
              exit 1
            fi
            echo "${proof} ran."
          done

      - name: Upload the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odoo-test-log
          path: |
            odoo-test.log
            extra-addons/l10n_ar_arca_edi/cross-process.log
          if-no-files-found: ignore
