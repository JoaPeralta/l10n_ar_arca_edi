name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      run_emission:
        description: >-
          Continue the same session with a real voucher in homologación. This
          consumes a number at the configured point of sale and cannot be
          undone. Leave off to run the read-only half and stop there. Either
          way the run costs exactly one ARCA access ticket.
        type: boolean
        default: false

# Ordinary CI is disposable and superseded by the next push, so it still
# cancels. A manual run is not: by the time it is a few seconds old it may
# already hold an ARCA access ticket, and cancelling it destroys the only copy
# of a ticket ARCA keeps for twelve more hours. The next run is then refused
# with "El CEE ya posee un TA valido para el acceso al WSN solicitado".
#
# The event name is part of the group, so a push and a workflow_dispatch can
# never land in the same group and a push can never cancel a manual run.
# Serialisation of the ARCA session itself is a separate, repository-wide group
# on the homologation job below.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  # Pinned rather than floating: a build must be able to say exactly which
  # Odoo it ran against.
  ODOO_IMAGE: odoo:19.0-20260723

jobs:
  lint:
    name: Lint and manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling
        run: pip install --quiet ruff==0.6.9 PyYAML==6.0.2

      # Correctness only. Enforcing a formatter upstream does not use would
      # bury real changes under a reformat of the whole module.
      - name: Ruff
        run: ruff check .

      # The cooldown decides whether a run may talk to ARCA at all, and the
      # design tests assert the properties that keep one run to one ticket.
      # Both are offline: no token, no network, no ARCA.
      - name: Workflow and cooldown tests
        run: |
          python -m unittest discover \
            --start-directory .github/scripts \
            --top-level-directory .github/scripts \
            --pattern 'test_*.py' \
            --verbose

      - name: Manifest is valid Python and declares what it needs
        run: |
          python - <<'PY'
          import ast
          import pathlib

          manifest = ast.literal_eval(pathlib.Path("__manifest__.py").read_text())

          assert manifest["license"] == "AGPL-3", manifest["license"]
          assert manifest["version"].startswith("19.0."), manifest["version"]
          assert "l10n_ar" in manifest["depends"], manifest["depends"]

          missing = [
              entry for entry in manifest["data"]
              if not pathlib.Path(entry).exists()
          ]
          assert not missing, f"declared but absent: {missing}"

          for asset in manifest.get("assets", {}).get("web.assets_backend", []):
              path = pathlib.Path(asset.split("/", 1)[1])
              assert path.exists(), f"missing asset: {asset}"

          print("manifest OK")
          PY

      - name: XML is well formed
        run: |
          python - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET

          for path in sorted(pathlib.Path(".").rglob("*.xml")):
              if ".github" in path.parts:
                  continue
              ET.parse(path)
          print("XML OK")
          PY

  secrets:
    name: No secrets committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject private keys and certificates in the tree
        run: |
          set -euo pipefail
          # Test fixtures generate their key material at runtime, so anything
          # that looks like real key material has no business being committed.
          if git grep -nI -E -- '-----BEGIN (RSA |EC |OPENSSH |PGP )?PRIVATE KEY-----' -- . ':!.github/workflows/ci.yml'; then
            echo "::error::A private key is committed to the repository"
            exit 1
          fi
          if git ls-files | grep -E '\.(pem|key|p12|pfx|crt|cer)$'; then
            echo "::error::Certificate or key files are committed to the repository"
            exit 1
          fi
          echo "No key material found"

      - name: Reject hard-coded ARCA credentials
        run: |
          set -euo pipefail
          # A literal value assigned to one of these variables. Shell
          # substitutions are how the documentation shows the variables being
          # set from a file, so a value starting with $ is not a credential.
          if git grep -nI -E 'ARCA_HOMO_(CERT|PRIVATE_KEY|CERT_HOLDER_CUIT|REPRESENTED_CUIT)[[:space:]]*=[[:space:]]*["'\''][^$"'\'']{16,}' \
              -- . ':!.github/workflows/ci.yml'; then
            echo "::error::Homologation credentials appear to be hard-coded"
            exit 1
          fi
          echo "No hard-coded credentials found"

      - name: Production endpoints are never the default
        run: |
          set -euo pipefail
          # A default that points at production is the one mistake that cannot
          # be undone, so it is checked mechanically.
          if grep -rn 'default="production"\|default='\''production'\''' --include=*.py --include=*.xml .; then
            echo "::error::Something defaults to the ARCA production environment"
            exit 1
          fi
          echo "Production is not a default anywhere"

  test:
    name: Odoo 19 tests
    runs-on: ubuntu-latest
    container:
      image: odoo:19.0-20260723
      options: --user root
    defaults:
      run:
        shell: bash
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          path: extra-addons/l10n_ar_arca_edi

      - name: Report the environment under test
        run: |
          odoo --version
          python3 -c "import zeep, cryptography, lxml; print('zeep', zeep.__version__); print('cryptography', cryptography.__version__); print('lxml', lxml.__version__ if hasattr(lxml, '__version__') else 'n/a')"

      - name: Install and run the test suite
        env:
          PGHOST: db
          PGUSER: odoo
          PGPASSWORD: odoo
        run: |
          set -o pipefail
          odoo \
            --db_host=db --db_user=odoo --db_password=odoo \
            -d ci_l10n_ar_arca_edi \
            --addons-path=/usr/lib/python3/dist-packages/odoo/addons,${GITHUB_WORKSPACE}/extra-addons \
            -i l10n_ar_arca_edi \
            --test-enable \
            --test-tags '/l10n_ar_arca_edi,-arca_homologation' \
            --without-demo=all \
            --log-level=info \
            --max-cron-threads=0 \
            --stop-after-init 2>&1 | tee odoo-test.log

      - name: Check the test summary
        run: |
          # Odoo's exit status already covers failures; this reads its own
          # summary so a suite that silently did not run is caught too. Grepping
          # for ERROR lines is not usable here: one test deliberately violates a
          # unique index to prove the database enforces the invariant, and
          # PostgreSQL logs that at ERROR level.
          summary=$(grep -oE '[0-9]+ failed, [0-9]+ error\(s\) of [0-9]+ tests' odoo-test.log | tail -1)
          if [ -z "$summary" ]; then
            echo "::error::No test summary was produced; the suite did not run."
            exit 1
          fi
          echo "$summary"
          failed=${summary%% failed*}
          rest=${summary#* failed, }
          errors=${rest%% error*}
          total=${summary##* of }
          total=${total%% tests}
          if [ "$failed" != "0" ] || [ "$errors" != "0" ]; then
            echo "::error::$summary"
            exit 1
          fi
          if [ "$total" -lt 100 ]; then
            echo "::error::Only $total tests ran; the suite looks truncated."
            exit 1
          fi
          echo "$total tests passed"

      - name: Upload the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odoo-test-log
          path: odoo-test.log
          if-no-files-found: ignore

  homologation:
    name: ARCA homologación (real)
    runs-on: ubuntu-latest
    # Never automatic: this talks to ARCA, and it needs a certificate that
    # cannot live in the repository.
    if: github.event_name == 'workflow_dispatch'
    # Repository-wide and branch-independent, because ARCA's limit is: one
    # access ticket per certificate and service, whichever branch asked for it.
    # Two sessions must queue, never overlap.
    #
    # cancel-in-progress is false for the same reason the workflow-level group
    # spares manual runs: after loginCms has returned, the ticket exists at ARCA
    # for twelve hours and the only copy lives in a database this run is about
    # to throw away. Cancelling here does not stop that ticket from existing --
    # it just guarantees the next run is refused.
    concurrency:
      group: arca-homologation-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      # Read-only, and only so the cooldown can ask when the previous manual run
      # last reached ARCA.
      actions: read
    container:
      image: odoo:19.0-20260723
      options: --user root
    defaults:
      run:
        shell: bash
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          path: extra-addons/l10n_ar_arca_edi

      - name: Skip cleanly when no certificate is configured
        id: creds
        env:
          # Only the holder CUIT is read here, and only to test for presence:
          # nothing is echoed, so no secret can reach the log.
          HOLDER: ${{ secrets.ARCA_HOMO_CERT_HOLDER_CUIT }}
          REPRESENTED: ${{ secrets.ARCA_HOMO_REPRESENTED_CUIT }}
        run: |
          if [ -z "${HOLDER}" ] || [ -z "${REPRESENTED}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No homologación certificate configured; nothing was sent to ARCA."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      # Runs before anything that could reach ARCA. A ticket obtained by an
      # earlier run outlives that run by twelve hours, and no database here has
      # a copy of it, so starting too soon is not a risk -- it is a guaranteed
      # refusal that costs a real ARCA call to discover.
      #
      # Being blocked leaves the session step below as `skipped`, which the
      # cooldown reads as "never reached ARCA": a refused attempt does not
      # restart the clock it was refused by.
      - name: Refuse to start while a previous ticket may still be alive
        if: steps.creds.outputs.available == 'true'
        env:
          # The job token, nothing else. No PAT, no new secret, and no fiscal
          # value is read by this script.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 "${GITHUB_WORKSPACE}/extra-addons/l10n_ar_arca_edi/.github/scripts/arca_cooldown.py"

      # One invocation, one database, one process, one access ticket. Reads
      # first; when the run asked for it, the emission continues inside the very
      # same test method, so it reuses the ticket the reads obtained instead of
      # authenticating again.
      - name: ARCA network session
        id: session
        if: steps.creds.outputs.available == 'true'
        env:
          ARCA_HOMO_CERT_HOLDER_CUIT: ${{ secrets.ARCA_HOMO_CERT_HOLDER_CUIT }}
          ARCA_HOMO_REPRESENTED_CUIT: ${{ secrets.ARCA_HOMO_REPRESENTED_CUIT }}
          ARCA_HOMO_CERT: ${{ secrets.ARCA_HOMO_CERT }}
          ARCA_HOMO_PRIVATE_KEY: ${{ secrets.ARCA_HOMO_PRIVATE_KEY }}
          ARCA_HOMO_POS: ${{ secrets.ARCA_HOMO_POS }}
          # Two gates on purpose: the run has to ask for it, and the session
          # itself still requires this variable. A voucher number cannot be
          # un-consumed, so neither gate is implied by having the credentials.
          ARCA_HOMO_ALLOW_EMISSION: ${{ inputs.run_emission && '1' || '' }}
        run: |
          set -o pipefail
          odoo \
            --db_host=db --db_user=odoo --db_password=odoo \
            -d homo_l10n_ar_arca_edi \
            --addons-path=/usr/lib/python3/dist-packages/odoo/addons,${GITHUB_WORKSPACE}/extra-addons \
            -i l10n_ar_arca_edi \
            --test-enable \
            --test-tags 'arca_homologation' \
            --without-demo=all \
            --log-level=info \
            --max-cron-threads=0 \
            --stop-after-init 2>&1 | tee arca-homologation.log

      # The regression this whole design exists to prevent, caught mechanically.
      # Counts the module's own log line; the token and the sign are never
      # logged, and nothing here searches for them.
      - name: Exactly one WSAA ticket was requested
        if: always() && steps.session.outcome != 'skipped'
        run: |
          set -euo pipefail
          if [ ! -f arca-homologation.log ]; then
            echo "::error::The session produced no log, so the number of ARCA tickets it took cannot be established."
            exit 1
          fi
          requests=$(grep -c 'WSAA: requesting a ticket for service' arca-homologation.log || true)
          if [ "$requests" -eq 1 ]; then
            echo "One access ticket was requested, as designed."
            exit 0
          fi
          if [ "$requests" -eq 0 ]; then
            echo "::error::The session never authenticated; no WSAA ticket was requested."
          else
            echo "::error::$requests WSAA tickets were requested in one session. ARCA issues one per certificate and service; the second is refused and the first is orphaned."
          fi
          exit 1

      - name: Upload the session log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arca-homologation-log
          path: arca-homologation.log
          if-no-files-found: ignore
